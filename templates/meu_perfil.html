<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Ad Brás Jardim Califórnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; color: #1e293b; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 15px 0; }
        .navbar-brand { font-weight: 700; color: #0f172a !important; font-size: 18px; }
        .card-custom { background: #ffffff; border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); padding: 30px; margin-top: 30px; }
        .btn-custom { border-radius: 8px; font-weight: 600; padding: 10px 20px; font-size: 14px; }
        .btn-dark-custom { background-color: #0f172a; color: #ffffff; border: none; }
        .btn-dark-custom:hover { background-color: #1e293b; color: #ffffff; }
        .form-control { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 14px; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-building me-2"></i>Ad Brás - Jardim Califórnia
            </a>
            <div class="d-flex align-items-center">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary btn-sm btn-custom me-2">
                    <i class="bi bi-arrow-left me-1"></i> Voltar ao Painel
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm btn-custom">
                    <i class="bi bi-box-arrow-right me-1"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 600px;">
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card-custom">
            <h3 class="fw-bold mb-4"><i class="bi bi-person-gear me-2"></i>Atualizar Meus Dados</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome Completo</label>
                    <input type="text" class="form-control" name="nome" value="{{ member.nome }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">CPF <small class="text-muted">(Não pode ser alterado por aqui)</small></label>
                    <input type="text" class="form-control bg-light" value="{{ member.cpf }}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Telefone / WhatsApp</label>
                    <input type="text" class="form-control" name="telefone" value="{{ member.telefone }}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Departamento</label>
                    <input type="text" class="form-control bg-light" value="{{ member.departamento or 'Não definido' }}" disabled>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-dark-custom btn-custom">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
