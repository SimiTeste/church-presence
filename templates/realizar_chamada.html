<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada - {{ evento.nome }} - Ad Brás Jardim Califórnia</title>
    <!-- Bootstrap CSS v5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            color: #1e293b;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 0;
        }
        .navbar-brand {
            font-weight: 700;
            color: #0f172a !important;
            font-size: 18px;
        }
        .card-custom {
            background: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 24px;
            margin-bottom: 24px;
        }
        .btn-custom {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 16px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-dark-custom {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
        }
        .btn-dark-custom:hover {
            background-color: #1e293b;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('leader.dashboard') }}">
                <i class="bi bi-building me-2"></i>Ad Brás - Jardim Califórnia
            </a>
            <a href="{{ url_for('leader.dashboard') }}" class="btn btn-outline-secondary btn-sm btn-custom">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao Painel
            </a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-4">
        <div class="card-custom">
            <h3 class="fw-bold mb-1"><i class="bi bi-check2-square me-2"></i>Chamada: {{ evento.nome }}</h3>
            <p class="text-muted small mb-4">Marque os membros presentes neste evento e clique em salvar:</p>
            
            <form method="POST">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3">Nome do Membro</th>
                                <th class="py-3">Departamento</th>
                                <th class="text-center py-3" style="width: 150px;">Presente</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for membro in membros %}
                            <tr>
                                <td class="fw-semibold text-dark">{{ membro.nome }}</td>
                                <td class="text-muted">{{ membro.departamento or 'Geral' }}</td>
                                <td class="text-center">
                                    <div class="form-check d-inline-block">
                                        <input type="checkbox" name="presente_{{ membro.id }}" class="form-check-input" style="width: 20px; height: 20px; cursor: pointer;"
                                            {% if presencas_atuais.get(membro.id) %}checked{% endif %}>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="mt-4 d-flex justify-content-between">
                    <a href="{{ url_for('leader.dashboard') }}" class="btn btn-outline-secondary btn-custom">Cancelar</a>
                    <button type="submit" class="btn btn-dark-custom btn-custom px-4">
                        <i class="bi bi-save me-1"></i> Salvar Chamada
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
